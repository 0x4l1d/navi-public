appId: io.github.oxalid.navipublic
productName: Navi Public
copyright: Copyright (c) 2026 0x4l1d
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
electronLanguages:
  - en-US
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: NaviPublic
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Navi-Public-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  shortcutName: Navi Public
publish: null
npmRebuild: false
